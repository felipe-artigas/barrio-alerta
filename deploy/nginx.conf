# Nginx recibe el tráfico público (80/443) y lo reenvía a Node, que solo escucha en 127.0.0.1:3000.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64k;
    server_tokens off;

    access_log /var/log/nginx/barrio-alerta.access.log;
    error_log  /var/log/nginx/barrio-alerta.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;   # el análisis con IA puede tardar unos segundos
    }
}
